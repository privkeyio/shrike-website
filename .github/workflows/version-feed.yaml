name: Version feed

# The wallet polls /version to tell users a newer release exists. Generated from the release itself rather than
# maintained by hand: a feed that silently stops being updated tells every user they are current forever.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read the latest Shrike release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(gh api repos/privkeyio/shrike/releases/latest -q .tag_name | sed 's/^v//')
          if [ -z "$version" ]; then
            echo "No release tag returned" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # main requires changes to arrive by pull request, so this opens one and merges it rather than pushing.
      # Pushing directly fails the rule, and it fails on the push, which only ever runs when there is something
      # to publish: the workflow would keep reporting success while the feed silently stopped being updated.
      - name: Publish the feed if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          printf '{\n  "version": "%s"\n}\n' "$VERSION" > version.new
          if cmp -s version.new version; then
            rm version.new
            echo "Feed already at $VERSION"
            exit 0
          fi

          mv version.new version
          branch="version-feed/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add version
          git commit -m "Publish $VERSION to the version feed"
          git push origin "$branch"

          gh pr create --base main --head "$branch" \
            --title "Publish $VERSION to the version feed" \
            --body "Generated from the latest Shrike release. The wallet polls /version to tell users a newer release exists."
          gh pr merge "$branch" --squash --delete-branch
